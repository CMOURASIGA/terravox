name: TerraVox offline playable build
on:
  push:
    branches: [develop]
    paths:
      - 'src/**'
      - 'public/**'
      - 'app/**'
      - 'scripts/smoke-local-build.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'server.ts'
      - 'vite.config.ts'
      - '.github/workflows/terravox-offline-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Compile playable game
        run: npm run build
      - name: Smoke-test local server, GLBs and game APIs
        run: node scripts/smoke-local-build.mjs
      - name: Check cinematic asset completeness (does not block playable preview)
        id: cinematic
        continue-on-error: true
        run: node scripts/validate-forest-v2-assets.mjs
      - name: Package standalone local testing bundle
        run: |
          mkdir -p offline-preview
          cp -R dist offline-preview/dist
          cp package.json package-lock.json offline-preview/
          printf 'TerraVox - build local\nBranch: %s\nCommit: %s\nBuild UTC: %s\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > offline-preview/VERSAO.txt
          cat > offline-preview/INICIAR_TERRAVOX.cmd <<'EOF'
          @echo off
          setlocal
          cd /d "%~dp0"
          where node >nul 2>nul
          if errorlevel 1 (
            echo Node.js nao encontrado. Instale Node.js 22 ou superior.
            pause
            exit /b 1
          )
          if not exist "node_modules" (
            echo Instalando dependencias na primeira execucao...
            call npm ci --no-audit --no-fund
            if errorlevel 1 (
              echo Falha ao instalar dependencias. Confira a conexao com a internet.
              pause
              exit /b 1
            )
          )
          echo.
          echo TerraVox: http://localhost:3000
          echo Versao deste pacote:
          type VERSAO.txt
          echo Mantenha esta janela aberta enquanto estiver jogando.
          echo Para encerrar, pressione Ctrl+C.
          echo Aguarde a mensagem de servidor iniciado antes de abrir o navegador.
          call npm start
          if errorlevel 1 pause
          EOF
          cat > offline-preview/README.txt <<'EOF'
          TerraVox - local playable preview (develop)

          Requirements: Node.js 22 or newer. No internet needed to launch the bundled game.

          WINDOWS (recommended):
          1. Extract the ZIP into a folder.
          2. Double-click INICIAR_TERRAVOX.cmd.
          3. Wait for the local server startup. Runtime dependencies are included.
          4. Open http://localhost:3000 in your browser.
          5. Check VERSAO.txt to confirm which commit is installed.
          Keep the terminal window open while playing.

          MANUAL (Windows/macOS/Linux):
          1. Open a terminal inside the extracted folder.
          2. Run npm start (dependencies are already included).
          3. Open http://localhost:3000.

          Stop with Ctrl+C.

          The built client, server and runtime dependencies are included. The app may require external
          services for features that depend on authentication or remote data.
          This package is not a Vercel deployment and does not validate GPU visuals.
          EOF
      - name: Include production dependencies for first-run offline play
        run: |
          cd offline-preview
          npm ci --omit=dev --no-audit --no-fund
          test -d node_modules/express
          test -d node_modules/react
          test -d node_modules/three
          echo "Runtime dependencies bundled; Windows does not need npm access to launch."
      - name: Verify Windows offline bundle integrity
        run: |
          test -s offline-preview/VERSAO.txt
          test -s offline-preview/INICIAR_TERRAVOX.cmd
          test -s offline-preview/README.txt
          test -s offline-preview/dist/server.cjs
          test -s offline-preview/dist/index.html
          test -d offline-preview/node_modules/express
          test -s offline-preview/package-lock.json
          grep -q "$GITHUB_SHA" offline-preview/VERSAO.txt
          grep -q "npm start" offline-preview/INICIAR_TERRAVOX.cmd
          test -s offline-preview/dist/assets/forest-v2/explorer.glb
          for asset in tree1 tree2 tree3 bush; do
            test -s "offline-preview/dist/assets/forest-v2/stylized/${asset}.glb"
          done
          echo "Windows bundle files and commit identity verified."
      - name: Publish playable development preview ZIP
        uses: actions/upload-artifact@v4
        with:
          name: terravox-develop-playable-preview
          path: offline-preview/
          retention-days: 14
      - name: Report verification scope
        run: |
          echo 'Cinematic asset check outcome: ${{ steps.cinematic.outcome }}' >> "$GITHUB_STEP_SUMMARY"
          echo '### TerraVox offline preview' >> "$GITHUB_STEP_SUMMARY"
          echo 'Typecheck, production build and HTTP smoke executed. Cinematic GLB completeness is checked separately and does not block the playable preview. No quiz API is required.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download and extract the terravox-develop-playable-preview artifact. Double-click INICIAR_TERRAVOX.cmd (Node.js 22 required), then open http://localhost:3000. Runtime dependencies are included.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Missing cinematic assets do not block testing the existing playable scene. Visual fidelity and browser interaction still require manual testing.' >> "$GITHUB_STEP_SUMMARY"
