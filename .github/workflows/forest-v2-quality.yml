name: TerraVox forest-v2 quality gates
on:
  push:
    branches: [develop]
    paths:
      - 'src/components/Forest3D.tsx'
      - 'src/components/ForestCinematicAssets.tsx'
      - 'scripts/validate-forest-v2-assets.mjs'
      - 'scripts/stage-forest-v2-assets.py'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/forest-v2-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GAME_PREVIEW_URL: ${{ vars.GAME_PREVIEW_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Game preview smoke (deployed environment)
        if: ${{ env.GAME_PREVIEW_URL != '' && env.VERCEL_TOKEN != '' }}
        env:
          GAME_PREVIEW_URL: ${{ vars.GAME_PREVIEW_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npm run test:game-preview
      - name: Report missing preview smoke configuration
        if: ${{ env.GAME_PREVIEW_URL == '' || env.VERCEL_TOKEN == '' }}
        run: |
          echo '::warning::Game preview smoke NOT EXECUTED: configure GAME_PREVIEW_URL (Actions variable) and VERCEL_TOKEN (Actions secret).'
          echo 'PREVIEW_SMOKE_NOT_VERIFIED' >> "$GITHUB_STEP_SUMMARY"
      - name: Validate complete forest asset bundle when present
        run: |
          if [ -d public/assets/forest-v2 ]; then
            node scripts/validate-forest-v2-assets.mjs
          else
            echo 'Cinematic assets not staged; existing scene remains active'
          fi
