name: B3.3-A Generate Migration Stubs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Generate versioned B3.3-A migration stubs
    if: github.ref == 'refs/heads/chore/b3-3-a-reconciliation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the isolated branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: chore/b3-3-a-reconciliation
          persist-credentials: true

      - name: Generate migrations with Supabase CLI 2.121.0
        working-directory: blender-mcp
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.121.0 --version
          npx --yes supabase@2.121.0 migration new reconcile_blender_asset_processing_persistence
          sleep 2
          npx --yes supabase@2.121.0 migration new refine_blender_asset_processing_active_source_uniqueness
          sleep 2
          npx --yes supabase@2.121.0 migration new enforce_blender_asset_processing_integrity

      - name: Commit only generated migration stubs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blender-mcp/supabase/migrations
          git diff --cached --quiet && exit 0
          git commit -m "chore(db): generate B3.3-A reconciliation migration stubs"
          git push origin HEAD:chore/b3-3-a-reconciliation
