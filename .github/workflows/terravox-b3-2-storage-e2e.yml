name: TerraVox B3.2 Storage E2E temporary
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed SHA
        required: true
        type: string
      confirmation:
        description: Type EXECUTE_B3_2_STORAGE_E2E
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: terravox-b3-2-storage-e2e
  cancel-in-progress: false
jobs:
  e2e:
    if: github.ref == 'refs/heads/feat/b3-2-private-asset-storage' && inputs.confirmation == 'EXECUTE_B3_2_STORAGE_E2E'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: terravox-b3-2-homologation
    defaults:
      run:
        working-directory: blender-mcp
        shell: bash
    env:
      EXPECTED_REF: xrlfacfivlaeatzffcde
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: blender-mcp/package-lock.json
      - name: Guard target and credentials
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$SUPABASE_URL" = "https://$EXPECTED_REF.supabase.co"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Install and regression check
        run: npm ci && npm run typecheck && npm run lint && npm test && npm run build
      - name: Execute isolated signed storage E2E
        run: node dist/scripts/e2e-asset-storage.js | tee e2e-storage-sanitized.log
      - name: Publish sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b3-2-storage-e2e-sanitized-${{ github.run_id }}
          retention-days: 7
          path: blender-mcp/e2e-storage-sanitized.log
