name: TerraVox B3.2 Storage E2E temporary

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact approved source SHA
        required: true
        type: string
      confirmation:
        description: Type EXECUTE_B3_2_STORAGE_E2E
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: terravox-b3-2-storage-e2e
  cancel-in-progress: false

jobs:
  e2e:
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.expected_sha == '17cfac9ae458fe2270db80414e5fd7ad68c81a97' &&
      inputs.confirmation == 'EXECUTE_B3_2_STORAGE_E2E'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: terravox-b3-2-homologation
    defaults:
      run:
        working-directory: blender-mcp
        shell: bash
    env:
      APPROVED_SOURCE_SHA: 17cfac9ae458fe2270db80414e5fd7ad68c81a97
      APPROVED_SOURCE_BRANCH: feat/b3-2-private-asset-storage
      EXPECTED_PROJECT_REF: xrlfacfivlaeatzffcde
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout only the approved B3.2 source snapshot
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.APPROVED_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up the fixed Node runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v22.14.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: blender-mcp/package-lock.json

      - name: Guard dispatcher, source snapshot, project, and credentials
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${{ inputs.expected_sha }}" = "${APPROVED_SOURCE_SHA}"
          test "$(git rev-parse HEAD)" = "${APPROVED_SOURCE_SHA}"
          test "${EXPECTED_PROJECT_REF}" = "xrlfacfivlaeatzffcde"
          test "${SUPABASE_URL}" = "https://${EXPECTED_PROJECT_REF}.supabase.co"
          test -n "${SUPABASE_SERVICE_ROLE_KEY}"

      - name: Install and run the approved regression suite
        run: npm ci && npm run typecheck && npm run lint && npm test && npm run build

      - name: Execute isolated signed storage E2E
        run: |
          set -euo pipefail
          node dist/scripts/e2e-asset-storage.js | tee e2e-storage-sanitized.log

      - name: Publish sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: b3-2-storage-e2e-sanitized-${{ github.run_id }}
          retention-days: 7
          path: blender-mcp/e2e-storage-sanitized.log
