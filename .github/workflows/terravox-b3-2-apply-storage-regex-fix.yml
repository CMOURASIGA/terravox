name: TerraVox B3.2 apply storage regex fix

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Exact approved B3.2 source SHA
        required: true
        type: string
      expected_sql_sha256:
        description: Exact SHA-256 of the approved migration SQL
        required: true
        type: string
      mode:
        description: validate is read-only, apply executes only the approved migration
        required: true
        type: choice
        options:
          - validate
          - apply
      confirmation:
        description: Type VALIDATE_B3_2_STORAGE_REGEX_FIX or APPLY_B3_2_STORAGE_REGEX_FIX
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: terravox-b3-2-apply-storage-regex-fix
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.expected_source_sha == '17cfac9ae458fe2270db80414e5fd7ad68c81a97' &&
      inputs.expected_sql_sha256 == 'cb501ed2390231fa4f57a87e038cddbada0701da7a35d61a0f36f07bba07f430' &&
      (
        (inputs.mode == 'validate' && inputs.confirmation == 'VALIDATE_B3_2_STORAGE_REGEX_FIX') ||
        (inputs.mode == 'apply' && inputs.confirmation == 'APPLY_B3_2_STORAGE_REGEX_FIX')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: terravox-b3-2-homologation
    defaults:
      run:
        working-directory: blender-mcp
        shell: bash
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
      APPROVED_SOURCE_SHA: 17cfac9ae458fe2270db80414e5fd7ad68c81a97
      EXPECTED_PROJECT_REF: xrlfacfivlaeatzffcde
      EXPECTED_SQL_SHA256: cb501ed2390231fa4f57a87e038cddbada0701da7a35d61a0f36f07bba07f430
      MIGRATION_VERSION: "20261023120000"
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout only the approved B3.2 source snapshot
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.APPROVED_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install fixed Supabase CLI
        run: |
          set -euo pipefail
          npx --yes supabase@2.121.0 --version

      - name: Guard source, project, migration and administrative secrets
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${{ inputs.expected_source_sha }}" = "${APPROVED_SOURCE_SHA}"
          test "$(git rev-parse HEAD)" = "${APPROVED_SOURCE_SHA}"
          test "${EXPECTED_PROJECT_REF}" = "xrlfacfivlaeatzffcde"
          test -n "${SUPABASE_ACCESS_TOKEN}"
          test -n "${SUPABASE_DB_PASSWORD}"

          migration="supabase/migrations/${MIGRATION_VERSION}_fix_blender_asset_storage_shape_regex_escapes.sql"
          test -f "${migration}"
          actual_sha="$(sha256sum "${migration}" | awk '{print $1}')"
          test "${actual_sha}" = "${EXPECTED_SQL_SHA256}"

          test "$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')" = "7"
          grep -q "drop constraint if exists blender_asset_objects_storage_shape_check" "${migration}"
          ! grep -Eiq "(grant |revoke |create policy|drop policy|storage\\.buckets)" "${migration}"

      - name: Link only the expected Supabase project
        run: |
          set -euo pipefail
          npx --yes supabase@2.121.0 link \
            --project-ref "${EXPECTED_PROJECT_REF}" \
            --password "${SUPABASE_DB_PASSWORD}"

      - name: Capture read-only security and data baseline
        run: |
          set -euo pipefail
          cat > audit.sql <<'SQL'
          select jsonb_build_object(
            'constraint_definition', pg_get_constraintdef(c.oid),
            'rls_enabled', cls.relrowsecurity,
            'policy_count', (select count(*) from pg_policies where schemaname = 'public' and tablename = 'blender_asset_objects'),
            'private_blender_buckets', (select count(*) from storage.buckets where id in ('blender-assets-incoming', 'blender-assets-derived') and public = false),
            'client_crud_privilege_count', (
              select count(*)
              from (values
                (has_table_privilege('anon', 'public.blender_asset_objects', 'select')),
                (has_table_privilege('anon', 'public.blender_asset_objects', 'insert')),
                (has_table_privilege('anon', 'public.blender_asset_objects', 'update')),
                (has_table_privilege('anon', 'public.blender_asset_objects', 'delete')),
                (has_table_privilege('authenticated', 'public.blender_asset_objects', 'select')),
                (has_table_privilege('authenticated', 'public.blender_asset_objects', 'insert')),
                (has_table_privilege('authenticated', 'public.blender_asset_objects', 'update')),
                (has_table_privilege('authenticated', 'public.blender_asset_objects', 'delete'))
              ) as privileges(allowed)
              where allowed
            ),
            'service_role_crud_privilege_count', (
              select count(*)
              from (values
                (has_table_privilege('service_role', 'public.blender_asset_objects', 'select')),
                (has_table_privilege('service_role', 'public.blender_asset_objects', 'insert')),
                (has_table_privilege('service_role', 'public.blender_asset_objects', 'update')),
                (has_table_privilege('service_role', 'public.blender_asset_objects', 'delete'))
              ) as privileges(allowed)
              where allowed
            ),
            'asset_rows', (select count(*) from public.blender_asset_objects),
            'questions_count', (select count(*) from public.questions),
            'learning_content_count', (select count(*) from public.learning_content),
            'publications_count', (select count(*) from public.product_content_publications)
          )
          from pg_constraint c
          join pg_class cls on cls.oid = c.conrelid
          join pg_namespace n on n.oid = cls.relnamespace
          where n.nspname = 'public'
            and cls.relname = 'blender_asset_objects'
            and c.conname = 'blender_asset_objects_storage_shape_check';
          SQL
          npx --yes supabase@2.121.0 db query --linked --file audit.sql --output-format json > audit-before.json
          node -e '
            const r = JSON.parse(require("fs").readFileSync("audit-before.json", "utf8"));
            const row = Array.isArray(r) && r.length === 1 && r[0] && typeof r[0] === "object" &&
              r[0].jsonb_build_object && typeof r[0].jsonb_build_object === "object" ? r[0].jsonb_build_object : null;
            if (!row || row.rls_enabled !== true || row.policy_count !== 0 ||
                row.private_blender_buckets !== 2 || row.client_crud_privilege_count !== 0 ||
                row.service_role_crud_privilege_count !== 4) process.exit(1);
          '

      - name: Confirm structured local and remote migration state
        run: |
          set -euo pipefail
          npx --yes supabase@2.121.0 migration list --linked --output-format json > migration-list-before.json
          node -e '
            const payload = JSON.parse(require("fs").readFileSync("migration-list-before.json", "utf8"));
            const rows = payload && Array.isArray(payload.migrations) ? payload.migrations : null;
            const expected = ["20260922155748","20261021192826","20261022150855","20261022170001","20261022181500","20261022190000"];
            const version = (row, side) => typeof row === "object" && row !== null && typeof row[side] === "string" ? row[side] : "";
            if (!rows || rows.length !== 7) process.exit(1);
            const validate = (items) => {
              if (!Array.isArray(items) || items.length !== 7) return false;
              for (const id of expected) {
                if (!items.some(r => version(r, "local") === id && version(r, "remote") === id)) return false;
              }
              const pending = items.filter(r => version(r, "local") && !version(r, "remote")).map(r => version(r, "local"));
              if (pending.length !== 1 || pending[0] !== process.env.MIGRATION_VERSION) return false;
              return !items.some(r => {
                const local = version(r, "local");
                const remote = version(r, "remote");
                return (!expected.includes(local) && local !== process.env.MIGRATION_VERSION) ||
                  (remote && !expected.includes(remote));
              });
            };
            if (!validate(rows)) process.exit(1);
            const canonical = expected.map(id => ({local: id, remote: id})).concat([{local: process.env.MIGRATION_VERSION, remote: ""}]);
            if (!validate(canonical) || validate(canonical.concat([{local: "20990101000000", remote: ""}])) ||
                validate(expected.map(id => ({local: id, remote: id})).concat([{local: "20261023130000", remote: ""}]))) process.exit(1);
          '

      - name: Apply only the approved pending migration
        if: inputs.mode == 'apply'
        run: |
          set -euo pipefail
          npx --yes supabase@2.121.0 migration up --linked | tee migration-up-sanitized.log

      - name: Confirm history and audit final state
        if: success() && inputs.mode == 'apply'
        run: |
          set -euo pipefail
          npx --yes supabase@2.121.0 migration list --linked --output-format json > migration-list-after.json
          node -e '
            const payload = JSON.parse(require("fs").readFileSync("migration-list-after.json", "utf8"));
            const rows = payload && Array.isArray(payload.migrations) ? payload.migrations : null;
            const expected = ["20260922155748","20261021192826","20261022150855","20261022170001","20261022181500","20261022190000", process.env.MIGRATION_VERSION];
            const version = (row, side) => typeof row === "object" && row !== null && typeof row[side] === "string" ? row[side] : "";
            if (!rows || rows.length !== expected.length) process.exit(1);
            for (const id of expected) {
              if (!rows.some(r => version(r, "local") === id && version(r, "remote") === id)) process.exit(1);
            }
          '
          npx --yes supabase@2.121.0 db query --linked --file audit.sql --output-format json > audit-after.json
          node -e '
            const before = JSON.parse(require("fs").readFileSync("audit-before.json", "utf8"));
            const after = JSON.parse(require("fs").readFileSync("audit-after.json", "utf8"));
            const auditRow = (payload) => Array.isArray(payload) && payload.length === 1 &&
              payload[0] && typeof payload[0] === "object" &&
              payload[0].jsonb_build_object && typeof payload[0].jsonb_build_object === "object"
                ? payload[0].jsonb_build_object : null;
            const b = auditRow(before);
            const a = auditRow(after);
            if (!a || a.rls_enabled !== true || a.policy_count !== 0 ||
                a.private_blender_buckets !== 2 || a.client_crud_privilege_count !== 0 ||
                a.service_role_crud_privilege_count !== 4) process.exit(1);
            for (const key of ["asset_rows", "questions_count", "learning_content_count", "publications_count"]) {
              if (a[key] !== b[key]) process.exit(1);
            }
            if (!String(a.constraint_definition).includes("\\.blend") ||
                !String(a.constraint_definition).includes("\\.glb") ||
                String(a.constraint_definition).includes("\\\\.blend") ||
                String(a.constraint_definition).includes("\\\\.glb")) process.exit(1);
          '

      - name: Publish sanitized execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: b3-2-storage-regex-fix-sanitized-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            blender-mcp/migration-list-before.json
            blender-mcp/migration-up-sanitized.log
            blender-mcp/migration-list-after.json
            blender-mcp/audit-before.json
            blender-mcp/audit-after.json
